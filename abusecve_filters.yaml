# ═══════════════════════════════════════════════════════════════════════════════
# AbuseCVE Filter Rules (Wazuh-style)
#
# This file is the SINGLE SOURCE OF TRUTH for CVE filter rules.
# Edit it directly on the server, then reload via POST /api/filters/reload.
#
# PQL Syntax Reference:
#   field:value          contains match (case-insensitive)
#   field:"multi word"   contains match with spaces
#   field:=value         exact match
#   field:~"pattern"     regex match (quote patterns containing parentheses)
#   field:!value         not-contains
#   field:>=N >N <N <=N  numeric comparisons
#   field:blank          field is null or empty
#   field:not_blank      field has a value
#   field:A,B,C          comma-separated OR of exact values
#   kev:true             boolean
#   AND OR NOT ( )       boolean logic with grouping
#
# Field Aliases:
#   cvss → cvss_score    sev → severity    desc → description
#   kev  → kev_flag      id  → cve_id      pub → published_date
#
# Available Fields:
#   cve_id, vendor, product, description, severity, cvss_score, cvss_vector,
#   source, sources, published_date, modified_date, kev_flag, cpe_names,
#   references, weaknesses, affected_products
# ═══════════════════════════════════════════════════════════════════════════════

rules:

  # ── 1001 ─ Fortinet: FortiEDR / FortiMail / FortiGuard / FortiAnalyzer ────
  - id: 1001
    name: "Fortinet - FortiEDR / FortiMail / FortiGuard / FortiAnalyzer"
    enabled: true
    alert_on_modified: true
    description: >-
      Monitors Fortinet EDR, Mail, Guard, and Analyzer products across all
      versions. Matches CVSS >= 3.0 or unrated CVEs.
    pql: >-
      (vendor:~"(?i)forti(net)?"
       OR description:~"(?i)fortinet"
       OR cpe_names:~"(?i):fortinet:"
       OR affected_products:~"(?i)fortinet")
      AND (cvss:>=3.0 OR cvss:blank)
      AND (description:~"(?i)forti[-_]?edr"
           OR product:~"(?i)forti[-_]?edr"
           OR cpe_names:~"(?i):forti_?edr"
           OR affected_products:~"(?i)forti[-_]?edr"
           OR description:~"(?i)forti[-_]?mail"
           OR product:~"(?i)forti[-_]?mail"
           OR cpe_names:~"(?i):forti_?mail"
           OR affected_products:~"(?i)forti[-_]?mail"
           OR description:~"(?i)forti[-_]?guard"
           OR product:~"(?i)forti[-_]?guard"
           OR cpe_names:~"(?i):forti_?guard"
           OR affected_products:~"(?i)forti[-_]?guard"
           OR description:~"(?i)forti[-_]?analyzer"
           OR product:~"(?i)forti[-_]?analyzer"
           OR cpe_names:~"(?i):forti_?analyzer"
           OR affected_products:~"(?i)forti[-_]?analyzer")


  # ── 1002 ─ Wazuh: All modules (excl. EDR Plugins) ─────────────────────────
  - id: 1002
    name: "Wazuh - All (excl. EDR Plugins)"
    enabled: true
    alert_on_modified: true
    description: >-
      Monitors all Wazuh CVEs (agent, manager, dashboard, API, indexer)
      across all versions. CVSS >= 3.0. Excludes third-party EDR plugin CVEs.
    pql: >-
      (vendor:~"(?i)wazuh"
       OR description:~"(?i)wazuh"
       OR product:~"(?i)wazuh"
       OR cpe_names:~"(?i):wazuh:"
       OR affected_products:~"(?i)wazuh")
      AND (cvss:>=3.0 OR cvss:blank)
      AND description:!"edr plugin"
      AND description:!edr-plugin
      AND description:!edr_plugin


  # ── 1003 ─ Microsoft: Azure / Sentinel / Exchange / Office 365 ─────────────
  - id: 1003
    name: "Microsoft - Azure / Sentinel / Exchange / Office365"
    enabled: true
    alert_on_modified: true
    description: >-
      Monitors Microsoft Azure (all services, Entra ID, Arc, DevOps),
      Sentinel, Exchange Server/Online, Office 365 / Microsoft 365.
      CVSS >= 7.0 (HIGH/CRITICAL only, no unrated).
    pql: >-
      cvss:>=7.0
      AND (vendor:~"(?i)microsoft"
           OR description:~"(?i)microsoft"
           OR cpe_names:~"(?i):microsoft:"
           OR affected_products:~"(?i)microsoft")
      AND (description:~"(?i)\bazure\b"
           OR product:~"(?i)\bazure\b"
           OR cpe_names:~"(?i):azure"
           OR affected_products:~"(?i)\bazure\b"
           OR description:~"(?i)(entra\s+(id|external|workload)|azure\s+(active\s+directory|ad\b))"
           OR description:~"(?i)(microsoft|azure)\s+sentinel"
           OR product:~"(?i)sentinel"
           OR cpe_names:~"(?i):sentinel"
           OR affected_products:~"(?i)sentinel"
           OR description:~"(?i)(microsoft\s+)?exchange(\s+(server|online))?"
           OR product:~"(?i)exchange"
           OR cpe_names:~"(?i):exchange"
           OR affected_products:~"(?i)exchange"
           OR description:~"(?i)(office|microsoft)[\s_-]?365|\bm365\b"
           OR product:~"(?i)(office|microsoft)[\s_-]?365"
           OR cpe_names:~"(?i):(office|microsoft)_?365"
           OR affected_products:~"(?i)(office|microsoft)[\s_-]?365")
