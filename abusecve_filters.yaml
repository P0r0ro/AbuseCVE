filter_rules:

  # ═══════════════════════════════════════════════════════════════════════════
  # FORTINET — FortiEDR / FortiMail / FortiGuard / FortiAnalyzer
  #
  # Severity: CVSS ≥ 3.0 (embedded in conditions, no legacy severity_filter)
  # Catches all version variants via regex OR across all relevant fields.
  # ═══════════════════════════════════════════════════════════════════════════
  - name: "Fortinet - FortiEDR / FortiMail / FortiGuard / FortiAnalyzer"
    vendor: "fortinet"
    products: []
    enabled: true
    min_cvss: 3.0
    max_cvss: 10.0
    severity_filter: []
    include_unknown: true
    keywords_include: []
    keywords_exclude: []
    alert_on_modified: true
    description: >
      Monitors Fortinet EDR, Mail, Guard, and Analyzer products across all
      versions using regex OR conditions with CVSS >= 3.0 constraint embedded.
    conditions:
      logic: "AND"
      conditions:
        # CVSS must be >= 3.0 OR unrated (include_unknown handled in legacy mode,
        # but we add it here for conditions mode)
        - logic: "OR"
          conditions:
            - field: "cvss_score"
              operator: "gte"
              value: 3.0
            - field: "cvss_score"
              operator: "blank"

        # Must be Fortinet-related (any field)
        - logic: "OR"
          conditions:
            - field: "vendor"
              operator: "regex"
              value: "(?i)forti(net)?"
            - field: "description"
              operator: "regex"
              value: "(?i)fortinet"
            - field: "cpe_names"
              operator: "regex"
              value: "(?i):fortinet:"
            - field: "affected_products"
              operator: "regex"
              value: "(?i)fortinet"

        # Must mention at least one target product
        - logic: "OR"
          conditions:
            - field: "description"
              operator: "regex"
              value: "(?i)forti[-_]?edr"
            - field: "product"
              operator: "regex"
              value: "(?i)forti[-_]?edr"
            - field: "cpe_names"
              operator: "regex"
              value: "(?i):forti_?edr"
            - field: "affected_products"
              operator: "regex"
              value: "(?i)forti[-_]?edr"
            - field: "description"
              operator: "regex"
              value: "(?i)forti[-_]?mail"
            - field: "product"
              operator: "regex"
              value: "(?i)forti[-_]?mail"
            - field: "cpe_names"
              operator: "regex"
              value: "(?i):forti_?mail"
            - field: "affected_products"
              operator: "regex"
              value: "(?i)forti[-_]?mail"
            - field: "description"
              operator: "regex"
              value: "(?i)forti[-_]?guard"
            - field: "product"
              operator: "regex"
              value: "(?i)forti[-_]?guard"
            - field: "cpe_names"
              operator: "regex"
              value: "(?i):forti_?guard"
            - field: "affected_products"
              operator: "regex"
              value: "(?i)forti[-_]?guard"
            - field: "description"
              operator: "regex"
              value: "(?i)forti[-_]?analyzer"
            - field: "product"
              operator: "regex"
              value: "(?i)forti[-_]?analyzer"
            - field: "cpe_names"
              operator: "regex"
              value: "(?i):forti_?analyzer"
            - field: "affected_products"
              operator: "regex"
              value: "(?i)forti[-_]?analyzer"

  # ═══════════════════════════════════════════════════════════════════════════
  # WAZUH — All modules except EDR plugins
  # ═══════════════════════════════════════════════════════════════════════════
  - name: "Wazuh - All (excl. EDR Plugins)"
    vendor: "wazuh"
    products: []
    enabled: true
    min_cvss: 3.0
    max_cvss: 10.0
    severity_filter: []
    include_unknown: true
    keywords_include: []
    keywords_exclude:
      - "edr plugin"
      - "edr-plugin"
      - "edr_plugin"
    alert_on_modified: true
    description: >
      Monitors all Wazuh CVEs (agent, manager, dashboard, API, indexer) across
      all versions. CVSS >= 3.0. Excludes third-party EDR plugin CVEs.
    conditions:
      logic: "AND"
      conditions:
        # CVSS >= 3.0 OR unrated
        - logic: "OR"
          conditions:
            - field: "cvss_score"
              operator: "gte"
              value: 3.0
            - field: "cvss_score"
              operator: "blank"

        # Must mention Wazuh in any field
        - logic: "OR"
          conditions:
            - field: "vendor"
              operator: "regex"
              value: "(?i)wazuh"
            - field: "description"
              operator: "regex"
              value: "(?i)wazuh"
            - field: "product"
              operator: "regex"
              value: "(?i)wazuh"
            - field: "cpe_names"
              operator: "regex"
              value: "(?i):wazuh:"
            - field: "affected_products"
              operator: "regex"
              value: "(?i)wazuh"

        # Exclude pure EDR plugin CVEs
        - field: "description"
          operator: "not_contains"
          value: "edr plugin"
        - field: "description"
          operator: "not_contains"
          value: "edr-plugin"
        - field: "description"
          operator: "not_contains"
          value: "edr_plugin"

  # ═══════════════════════════════════════════════════════════════════════════
  # MICROSOFT — Azure / Sentinel / Exchange / Office 365
  # ═══════════════════════════════════════════════════════════════════════════
  - name: "Microsoft - Azure / Sentinel / Exchange / Office365"
    vendor: "microsoft"
    products: []
    enabled: true
    min_cvss: 7.0
    max_cvss: 10.0
    severity_filter: []
    include_unknown: false
    keywords_include: []
    keywords_exclude: []
    alert_on_modified: true
    description: >
      Monitors Microsoft Azure (all services, Entra ID, Arc, DevOps),
      Microsoft Sentinel, Exchange Server (all versions) and Exchange Online,
      Office 365 / Microsoft 365. CVSS >= 7.0 (HIGH/CRITICAL only).
    conditions:
      logic: "AND"
      conditions:
        # CVSS >= 7.0 (HIGH / CRITICAL only, no unrated)
        - field: "cvss_score"
          operator: "gte"
          value: 7.0

        # Must be Microsoft-related
        - logic: "OR"
          conditions:
            - field: "vendor"
              operator: "regex"
              value: "(?i)microsoft"
            - field: "description"
              operator: "regex"
              value: "(?i)microsoft"
            - field: "cpe_names"
              operator: "regex"
              value: "(?i):microsoft:"
            - field: "affected_products"
              operator: "regex"
              value: "(?i)microsoft"

        # Must mention one of the target product families
        - logic: "OR"
          conditions:
            # Azure (all services)
            - field: "description"
              operator: "regex"
              value: "(?i)\\bazure\\b"
            - field: "product"
              operator: "regex"
              value: "(?i)\\bazure\\b"
            - field: "cpe_names"
              operator: "regex"
              value: "(?i):azure"
            - field: "affected_products"
              operator: "regex"
              value: "(?i)\\bazure\\b"
            # Entra ID / Azure AD
            - field: "description"
              operator: "regex"
              value: "(?i)(entra\\s+(id|external|workload)|azure\\s+(active\\s+directory|ad\\b))"
            # Sentinel
            - field: "description"
              operator: "regex"
              value: "(?i)(microsoft|azure)\\s+sentinel"
            - field: "product"
              operator: "regex"
              value: "(?i)sentinel"
            - field: "cpe_names"
              operator: "regex"
              value: "(?i):sentinel"
            - field: "affected_products"
              operator: "regex"
              value: "(?i)sentinel"
            # Exchange Server / Online
            - field: "description"
              operator: "regex"
              value: "(?i)(microsoft\\s+)?exchange(\\s+(server|online))?"
            - field: "product"
              operator: "regex"
              value: "(?i)exchange"
            - field: "cpe_names"
              operator: "regex"
              value: "(?i):exchange"
            - field: "affected_products"
              operator: "regex"
              value: "(?i)exchange"
            # Office 365 / Microsoft 365 / M365
            - field: "description"
              operator: "regex"
              value: "(?i)(office|microsoft)[\\s_-]?365|\\bm365\\b"
            - field: "product"
              operator: "regex"
              value: "(?i)(office|microsoft)[\\s_-]?365"
            - field: "cpe_names"
              operator: "regex"
              value: "(?i):(office|microsoft)_?365"
            - field: "affected_products"
              operator: "regex"
              value: "(?i)(office|microsoft)[\\s_-]?365"
